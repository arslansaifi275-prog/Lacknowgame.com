<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Prediction - Fast Win</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .balance {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .deposit-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .deposit-btn:hover {
            transform: scale(1.05);
        }

        /* Period & Timer */
        .period-timer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .period {
            font-weight: 700;
            color: #333;
            font-size: 1.1rem;
        }

        #periodNumber {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .timer {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #ff4757, #ff6b9d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            min-width: 100px;
            text-align: center;
        }

        /* Bet Amount */
        .bet-amount {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .amount-btn {
            background: rgba(255,255,255,0.9);
            border: 2px solid #e0e0e0;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .amount-btn.active,
        .amount-btn:hover {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-color: #667eea;
            transform: translateY(-2px);
        }

        /* Color Buttons */
        .color-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .color-btn {
            flex: 1;
            min-width: 100px;
            padding: 20px 15px;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .color-btn .emoji {
            font-size: 2.5rem;
        }

        .color-btn .multiplier {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .green { background: linear-gradient(45deg, #00b894, #00cec9); color: white; }
        .red { background: linear-gradient(45deg, #e17055, #d63031); color: white; }
        .violet { background: linear-gradient(45deg, #a29bfe, #6c5ce7); color: white; }

        .color-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .color-btn:active {
            transform: scale(0.95);
        }

        /* Current Bets */
        .current-bets {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .bet-info {
            display: flex;
            justify-content: space-around;
            font-weight: 600;
            font-size: 1.1rem;
        }

        /* History */
        .history {
            flex: 1;
        }

        .history h3 {
            text-align: center;
            margin-bottom: 15px;
            color: white;
            font-size: 1.2rem;
        }

        .history-table {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-weight: 500;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-color {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .win { animation: winPulse 0.6s ease-in-out; }
        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            margin: 50% auto;
            transform: translateY(-50%);
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            position: relative;
        }

        .close {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 24px;
            cursor: pointer;
        }

        .deposit-confirm {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }

        /* ADMIN PANEL */
        body.admin-body {
            background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        }

        .admin-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .admin-header h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .period-admin {
            font-size: 1.2rem;
            font-weight: 600;
            color: #34495e;
        }

        .bet-stats {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .stat-item {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        .stat-item .color {
            font-size: 1.2rem;
        }

        .stat-item.total {
            background: linear-gradient(45deg, #f39c12, #e67e22);
            color: white;
        }

        .result-control {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .control-panel {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        #resultColor {
            padding: 15px;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 1rem;
            min-width: 200px;
        }

        .set-result-btn, .next-round-btn {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .set-result-btn {
            background: linear-gradient(45deg, #e74c3c, #c0392b);
            color: white;
        }

        .next-round-btn {
            background: linear-gradient(45deg, #27ae60, #2ecc71);
            color: white;
        }

        .set-result-btn:hover, .next-round-btn:hover {
            transform: translateY(-2px);
        }

        .activity {
            background: rgba(255,255,255,0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }

        .activity-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
