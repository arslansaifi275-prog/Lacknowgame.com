<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucknow Game</title><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#333;min-height:100vh}.container{max-width:400px;margin:0 auto;padding:20px;min-height:100vh;display:flex;flex-direction:column}.header{background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-radius:20px;padding:20px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.1);text-align:center}.header h1{font-size:1.5rem;font-weight:700;margin-bottom:15px;color:#333}.balance{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:1.1rem}.deposit-btn{background:linear-gradient(45deg,#4CAF50,#45a049);color:white;border:none;padding:12px 20px;border-radius:25px;font-weight:600;cursor:pointer}.period-timer{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.95);padding:20px;border-radius:20px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,.1)}.period{font-weight:700;color:#333;font-size:1.1rem}#periodNumber{font-weight:800;background:linear-gradient(45deg,#ff6b6b,#4ecdc4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.timer{font-size:2rem;font-weight:700;background:linear-gradient(45deg,#ff4757,#ff6b9d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;min-width:100px;text-align:center}.bet-amount{display:flex;gap:10px;margin-bottom:25px;justify-content:center;flex-wrap:wrap}.amount-btn{background:rgba(255,255,255,.9);border:2px solid #e0e0e0;padding:12px 20px;border-radius:25px;cursor:pointer;font-weight:600;transition:all .3s}.amount-btn.active,.amount-btn:hover{background:linear-gradient(45deg,#667eea,#764ba2);color:white;border-color:#667eea;transform:translateY(-2px)}.color-buttons{display:flex;gap:15px;margin-bottom:25px;justify-content:center;flex-wrap:wrap}.color-btn{flex:1;min-width:100px;padding:20px 15px;border:none;border-radius:20px;font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 25px rgba(0,0,0,.15)}.color-btn .emoji{font-size:2.5rem}.color-btn .multiplier{font-size:.9rem;opacity:.9}.green{background:linear-gradient(45deg,#00b894,#00cec9);color:white}.
